<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magazyn Stali RENOX</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f1f3f6; color: #1f2937; }
    button, input, select { font: inherit; }

    .login-container { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .login-box { width: 100%; max-width: 400px; background: white; padding: 35px; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); }
    .login-box h1 { text-align: center; margin-top: 0; color: #1f2937; }
    .login-box p { text-align: center; color: #6b7280; }

    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px; }
    input, select { width: 100%; padding: 11px; border: 1px solid #d1d5db; border-radius: 7px; background: white; }

    button { border: none; border-radius: 7px; padding: 10px 16px; cursor: pointer; font-weight: bold; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-danger { background: #dc2626; color: white; }
    .btn-secondary { background: #6b7280; color: white; }
    .btn-edit { background: #f59e0b; color: white; }

    .hidden { display: none !important; }

    header { background: #111827; color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    header h1 { margin: 0; font-size: 22px; }
    .user-info { display: flex; align-items: center; gap: 12px; font-size: 14px; }

    .app { max-width: 1400px; margin: 0 auto; padding: 25px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 15px; flex-wrap: wrap; }
    .top-bar h2 { margin: 0; }

    .filters { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .filter-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 12px; }

    .table-container { background: white; border-radius: 10px; overflow-x: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    table { width: 100%; border-collapse: collapse; min-width: 1000px; }
    th { background: #e5e7eb; text-align: left; padding: 13px; font-size: 14px; }
    td { padding: 13px; border-top: 1px solid #e5e7eb; }
    tr:hover { background: #f9fafb; }

    .actions { display: flex; gap: 7px; }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 1000; }
    .modal-content { background: white; width: 100%; max-width: 560px; padding: 25px; border-radius: 12px; max-height: 90vh; overflow-y: auto; }
    .modal-content h2 { margin-top: 0; }
    .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

    .error { color: #dc2626; margin-top: 10px; text-align: center; }
    .success { color: #15803d; margin-top: 10px; text-align: center; }
    .empty { text-align: center; padding: 40px; color: #6b7280; }

    @media (max-width: 800px) {
      .filter-grid { grid-template-columns: 1fr; }
      header { flex-direction: column; align-items: flex-start; }
      .top-bar { flex-direction: column; align-items: flex-start; }
      .app { padding: 15px; }
    }
  </style>
</head>
<body>

<div id="loginScreen" class="login-container">
  <div class="login-box">
    <h1>🏭 Magazyn Stali</h1>
    <p>Zaloguj się do systemu</p>

    <div class="form-group">
      <label>Adres e-mail</label>
      <input type="email" id="loginEmail" placeholder="email@firma.pl">
    </div>

    <div class="form-group">
      <label>Hasło</label>
      <input type="password" id="loginPassword" placeholder="Hasło">
    </div>

    <button class="btn-primary" style="width:100%;" onclick="login()">ZALOGUJ</button>
    <div id="loginMessage"></div>
  </div>
</div>

<div id="appScreen" class="hidden">
  <header>
    <h1>🏭 Magazyn Stali RENOX</h1>
    <div class="user-info">
      <span id="userName"></span>
      <button class="btn-secondary" onclick="logout()">Wyloguj</button>
    </div>
  </header>

  <main class="app">
    <div class="top-bar">
      <h2>Materiały</h2>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn-secondary" onclick="exportExcelReport()">📊 EKSPORT EXCEL</button>
        <button class="btn-primary" onclick="openAddModal()">+ DODAJ MATERIAŁ</button>
      </div>
    </div>

    <div class="filters">
      <div class="filter-grid">
        <div>
          <label>🔎 Szukaj</label>
          <input type="text" id="searchInput" placeholder="Typ, gatunek, wymiar, lokalizacja..." oninput="renderMaterials()">
        </div>
        <div>
          <label>Typ</label>
          <select id="typeFilter" onchange="renderMaterials()"></select>
        </div>
        <div>
          <label>Gatunek</label>
          <select id="steelFilter" onchange="renderMaterials()"></select>
        </div>
        <div>
          <label>Lokalizacja</label>
          <select id="locationFilter" onchange="renderMaterials()"><option value="">Wszystkie</option></select>
        </div>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Typ</th>
            <th>Gatunek</th>
            <th>Wymiar [mm]</th>
            <th>Ilość</th>
            <th>Waga [kg]</th>
            <th>Lokalizacja</th>
            <th>Akcje</th>
            <th>Dodatkowe informacje</th>
          </tr>
        </thead>
        <tbody id="materialsTable"></tbody>
      </table>
    </div>
  </main>
</div>

<div id="materialModal" class="modal hidden">
  <div class="modal-content">
    <h2 id="modalTitle">Dodaj materiał</h2>
    <input type="hidden" id="materialId">
    <input type="hidden" id="materialDimension">

    <div class="form-group">
      <label>Typ</label>
      <select id="materialType" onchange="updateMaterialFields(); updateDimensionDescription(); recalcWeightPreview();"></select>
    </div>

    <div class="form-group">
      <label>Gatunek</label>
      <select id="materialSteel" onchange="updateDimensionDescription(); recalcWeightPreview();"></select>
    </div>

    <div class="form-group" id="groupLength">
      <label id="labelLength">Długość [mm]</label>
      <input type="number" id="materialLengthMm" min="0" step="0.1" oninput="updateDimensionDescription(); recalcWeightPreview();">
    </div>

    <div class="form-group" id="groupWidth">
      <label id="labelWidth">Szerokość [mm]</label>
      <input type="number" id="materialWidthMm" min="0" step="0.1" oninput="updateDimensionDescription(); recalcWeightPreview();">
    </div>

    <div class="form-group" id="groupHeight">
      <label id="labelHeight">Wysokość [mm]</label>
      <input type="number" id="materialHeightMm" min="0" step="0.1" oninput="updateDimensionDescription(); recalcWeightPreview();">
    </div>

    <div class="form-group" id="groupWall">
      <label id="labelWall">Grubość [mm]</label>
      <input type="number" id="materialWallMm" min="0" step="0.1" oninput="updateDimensionDescription(); recalcWeightPreview();">
    </div>

    <div class="form-group">
      <label>Ilość</label>
      <input type="number" id="materialQuantity" min="0" step="0.01" placeholder="np. 12" oninput="recalcWeightPreview();">
    </div>

    <div class="form-group">
      <label>Waga całkowita [kg]</label>
      <input type="text" id="materialTotalWeight" readonly>
    </div>

    <div class="form-group">
      <label>Lokalizacja</label>
      <select id="materialLocation"></select>
    </div>

    <div class="form-group">
      <label>Dział</label>
      <select id="materialDepartment"></select>
    </div>

    <div class="form-group">
      <label>Dodatkowe informacje</label>
      <input type="text" id="materialExtraInfo" placeholder="Wpisz dowolny tekst...">
    </div>

    <div id="modalMessage"></div>

    <div class="modal-buttons">
      <button class="btn-secondary" onclick="closeModal()">Anuluj</button>
      <button class="btn-primary" onclick="saveMaterial()">Zapisz</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://ynmcfagoxshigqbcgvkb.supabase.co";
  const SUPABASE_KEY = "sb_publishable_PCfv8KZPMsfqNwuZkBXj0A_zPxIcPZi";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const MATERIAL_TYPES = ["Blacha", "Profil", "Kątownik", "Płaskownik", "Rura", "Pręt", "Wałek"];
  const MATERIAL_GRADES = ["Aluminium", "S355", "S235", "Corten", "Stal nierdzewna 304", "Stal nierdzewna 316", "S700", "S650", "50HF", "DD11"];
  const DENSITY_BY_GRADE = {
    "Aluminium": 2700,
     "S355": 7850,
     "S235": 7850,
+    "S700": 7850,
+    "S650": 7850,
+    "DD11": 7850,
+    "50HF": 7850,
     "Corten": 7850,
     "Stal nierdzewna 304": 8000,
     "Stal nierdzewna 316": 8000
  };

  const LOCATION_OPTIONS = ["Hala", "Plac zewnętrzny", "Regały zewnętrzne"];

  let materials = [];
  let departments = [];
  let currentUser = null;

  function fillStaticDictionaries() {
    const typeFilter = document.getElementById("typeFilter");
    const materialType = document.getElementById("materialType");
    const steelFilter = document.getElementById("steelFilter");
    const materialSteel = document.getElementById("materialSteel");
    const locationFilter = document.getElementById("locationFilter");
    const materialLocation = document.getElementById("materialLocation");

    typeFilter.innerHTML = '<option value="">Wszystkie</option>';
    materialType.innerHTML = '';
    MATERIAL_TYPES.forEach(t => {
      typeFilter.innerHTML += `<option value="${t}">${t}</option>`;
      materialType.innerHTML += `<option value="${t}">${t}</option>`;
    });

    steelFilter.innerHTML = '<option value="">Wszystkie</option>';
    materialSteel.innerHTML = '';
    MATERIAL_GRADES.forEach(g => {
      steelFilter.innerHTML += `<option value="${g}">${g}</option>`;
      materialSteel.innerHTML += `<option value="${g}">${g}</option>`;
    });

    locationFilter.innerHTML = '<option value="">Wszystkie</option>';
    materialLocation.innerHTML = '<option value="">Wybierz...</option>';
    LOCATION_OPTIONS.forEach(loc => {
      locationFilter.innerHTML += `<option value="${loc}">${loc}</option>`;
      materialLocation.innerHTML += `<option value="${loc}">${loc}</option>`;
    });
  }

  function mmToM(v) {
    return (Number(v) || 0) / 1000;
  }

  function formatNum(v) {
    const n = Number(v);
    return Number.isFinite(n) && n > 0 ? String(n).replace(".", ",") : "";
  }

  function buildDimensionText(type, L, W, H, T) {
    const f = formatNum;
    let parts = [];

    if (type === "Blacha") parts = [f(W), f(L), `#${f(T)}`];
    else if (type === "Rura") parts = [f(W) ? "Ø" + f(W) : "", f(T), f(L)];
    else if (type === "Wałek" || type === "Pręt") parts = [f(W) ? "Ø" + f(W) : "", f(L)];
    else if (type === "Płaskownik") parts = [f(W), f(T), f(L)];
    else if (type === "Kątownik") parts = [f(W), f(H), f(T), f(L)];
    else if (type === "Profil") parts = [f(W), f(H), f(T), f(L)];

    return parts.filter(Boolean).join("x");
  }

  function getMaterialDimensionText(m) {
    const fromNumbers = buildDimensionText(
      m.typ,
      m.dlugosc_mm ?? m.length_mm,
      m.szerokosc_mm ?? m.width_mm,
      m.wysokosc_mm ?? m.height_mm,
      m.grubosc_mm ?? m.wall_mm
    );
    return fromNumbers || m.wymiar || "";
  }

  function updateMaterialFields() {
    const type = document.getElementById("materialType").value;
    const groupLength = document.getElementById("groupLength");
    const groupWidth = document.getElementById("groupWidth");
    const groupHeight = document.getElementById("groupHeight");
    const groupWall = document.getElementById("groupWall");

    const labelLength = document.getElementById("labelLength");
    const labelWidth = document.getElementById("labelWidth");
    const labelHeight = document.getElementById("labelHeight");
    const labelWall = document.getElementById("labelWall");

    const height = document.getElementById("materialHeightMm");
    const wall = document.getElementById("materialWallMm");

    const setVisible = (el, visible) => { el.style.display = visible ? "block" : "none"; };
    const clearValue = (el) => { el.value = ""; };

    setVisible(groupLength, false);
    setVisible(groupWidth, false);
    setVisible(groupHeight, false);
    setVisible(groupWall, false);

    if (type === "Blacha") {
      setVisible(groupLength, true);
      setVisible(groupWidth, true);
      setVisible(groupWall, true);
      labelLength.textContent = "Długość [mm]";
      labelWidth.textContent = "Szerokość [mm]";
      labelWall.textContent = "Grubość [mm]";
      clearValue(height);
    } else if (type === "Rura") {
      setVisible(groupLength, true);
      setVisible(groupWidth, true);
      setVisible(groupWall, true);
      labelLength.textContent = "Długość [mm]";
      labelWidth.textContent = "Średnica zewnętrzna [mm]";
      labelWall.textContent = "Grubość ścianki [mm]";
      clearValue(height);
    } else if (type === "Wałek" || type === "Pręt") {
      setVisible(groupLength, true);
      setVisible(groupWidth, true);
      labelLength.textContent = "Długość [mm]";
      labelWidth.textContent = "Średnica [mm]";
      clearValue(height);
      clearValue(wall);
    } else if (type === "Płaskownik") {
      setVisible(groupLength, true);
      setVisible(groupWidth, true);
      setVisible(groupWall, true);
      labelLength.textContent = "Długość [mm]";
      labelWidth.textContent = "Szerokość [mm]";
      labelWall.textContent = "Grubość [mm]";
      clearValue(height);
    } else if (type === "Kątownik") {
      setVisible(groupLength, true);
      setVisible(groupWidth, true);
      setVisible(groupHeight, true);
      setVisible(groupWall, true);
      labelLength.textContent = "Długość [mm]";
      labelWidth.textContent = "Ramię A [mm]";
      labelHeight.textContent = "Ramię B [mm]";
      labelWall.textContent = "Grubość [mm]";
    } else if (type === "Profil") {
      setVisible(groupLength, true);
      setVisible(groupWidth, true);
      setVisible(groupHeight, true);
      setVisible(groupWall, true);
      labelLength.textContent = "Długość [mm]";
      labelWidth.textContent = "Szerokość [mm]";
      labelHeight.textContent = "Wysokość [mm]";
      labelWall.textContent = "Grubość ścianki [mm]";
    }

    updateDimensionDescription();
  }

  function updateDimensionDescription() {
    const type = document.getElementById("materialType").value;
    const L = document.getElementById("materialLengthMm").value;
    const W = document.getElementById("materialWidthMm").value;
    const H = document.getElementById("materialHeightMm").value;
    const T = document.getElementById("materialWallMm").value;

    document.getElementById("materialDimension").value = buildDimensionText(type, L, W, H, T);
  }

  function calcMassPerPieceKg(m) {
    const density = Number(DENSITY_BY_GRADE[m.gatunek] || 7850);
    const type = (m.typ || "").toLowerCase();

    const L = mmToM(m.dlugosc_mm || m.length_mm);
    const W = mmToM(m.szerokosc_mm || m.width_mm);
    const H = mmToM(m.wysokosc_mm || m.height_mm);
    const T = mmToM(m.grubosc_mm || m.wall_mm);

    let volumeM3 = 0;

    if (type === "blacha" || type === "płaskownik" || type === "plaskownik") {
      volumeM3 = L * W * T;
    } else if (type === "pręt" || type === "pret" || type === "wałek" || type === "walek") {
      const D = W;
      const r = D / 2;
      volumeM3 = Math.PI * r * r * L;
    } else if (type === "rura") {
      const D = W;
      const d = Math.max(D - (2 * T), 0);
      volumeM3 = (Math.PI / 4) * (D * D - d * d) * L;
    } else if (["profil", "kątownik", "katownik"].includes(type)) {
      volumeM3 = L * W * H;
    }

    return volumeM3 * density;
  }

  function recalcWeightPreview() {
    const tmp = {
      typ: document.getElementById("materialType").value,
      gatunek: document.getElementById("materialSteel").value,
      dlugosc_mm: Number(document.getElementById("materialLengthMm").value || 0),
      szerokosc_mm: Number(document.getElementById("materialWidthMm").value || 0),
      wysokosc_mm: Number(document.getElementById("materialHeightMm").value || 0),
      grubosc_mm: Number(document.getElementById("materialWallMm").value || 0)
    };

    const qty = Number(document.getElementById("materialQuantity").value || 0);
    const massPerPiece = calcMassPerPieceKg(tmp);
    const total = massPerPiece * qty;

    document.getElementById("materialTotalWeight").value = Number.isFinite(total) && total > 0 ? total.toFixed(3) : "";
  }

  async function startApp() {
    fillStaticDictionaries();
    const { data } = await supabaseClient.auth.getSession();
    if (data.session) {
      currentUser = data.session.user;
      await showApplication();
    } else {
      showLogin();
    }
  }

  async function login() {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const message = document.getElementById("loginMessage");
    message.className = "";
    message.innerText = "Logowanie...";

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
      message.className = "error";
      message.innerText = "Błąd logowania: " + error.message;
      return;
    }

    currentUser = data.user;
    await showApplication();
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    currentUser = null;
    showLogin();
  }

  function showLogin() {
    document.getElementById("loginScreen").classList.remove("hidden");
    document.getElementById("appScreen").classList.add("hidden");
  }

  async function showApplication() {
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("appScreen").classList.remove("hidden");
    document.getElementById("userName").innerText = currentUser.email;

    await loadDepartments();
    await loadMaterials();
  }

  async function loadDepartments() {
    const { data, error } = await supabaseClient.from("dzialy").select("*").order("nazwa");
    if (error) {
      alert("Błąd pobierania działów: " + error.message);
      return;
    }

    departments = data || [];
    const select = document.getElementById("materialDepartment");
    select.innerHTML = "";
    departments.forEach(department => {
      const option = document.createElement("option");
      option.value = department.id;
      option.textContent = department.nazwa;
      select.appendChild(option);
    });
  }

  async function loadMaterials() {
    const { data, error } = await supabaseClient
      .from("materialy")
      .select(`*, dzialy ( nazwa )`)
      .order("id", { ascending: false });

    if (error) {
      alert("Błąd pobierania materiałów: " + error.message);
      return;
    }

    materials = data || [];
    updateLocationFilter();
    renderMaterials();
  }

  function updateLocationFilter() {
    const locationSelect = document.getElementById("locationFilter");
    const currentLocation = locationSelect.value;

    const locations = [...new Set(materials.map(m => m.lokalizacja).filter(Boolean))].sort();

    locationSelect.innerHTML = '<option value="">Wszystkie</option>';
    locations.forEach(loc => {
      const option = document.createElement("option");
      option.value = loc;
      option.textContent = loc;
      locationSelect.appendChild(option);
    });

    if (locations.includes(currentLocation)) locationSelect.value = currentLocation;
  }

  function renderMaterials() {
    const search = (document.getElementById("searchInput").value || "").toLowerCase().trim();
    const type = document.getElementById("typeFilter").value;
    const steel = document.getElementById("steelFilter").value;
    const location = document.getElementById("locationFilter").value;
    const tbody = document.getElementById("materialsTable");

    const filtered = materials.filter(m => {
      const hitSearch = !search || [m.typ, m.gatunek, getMaterialDimensionText(m), m.lokalizacja, m.dodatkowe_informacje].join(" ").toLowerCase().includes(search);
      const hitType = !type || m.typ === type;
      const hitSteel = !steel || m.gatunek === steel;
      const hitLocation = !location || m.lokalizacja === location;
      return hitSearch && hitType && hitSteel && hitLocation;
    });

    if (!filtered.length) {
      tbody.innerHTML = `<tr><td colspan="8" class="empty">Brak materiałów</td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map(m => {
      const qty = Number(m.ilosc || 0);
      const totalMass = calcMassPerPieceKg(m) * qty;
      return `
        <tr>
          <td>${m.typ || ''}</td>
          <td>${m.gatunek || ''}</td>
          <td>${getMaterialDimensionText(m)}</td>
          <td>${qty}</td>
          <td>${totalMass.toFixed(3)}</td>
          <td>${m.lokalizacja || ''}</td>
          <td>
            <div class="actions">
              <button class="btn-edit" onclick="openEditModal(${m.id})">Edytuj</button>
              <button class="btn-danger" onclick="deleteMaterial(${m.id})">Usuń</button>
            </div>
          </td>
          <td>${m.dodatkowe_informacje || ''}</td>
        </tr>
      `;
    }).join('');
  }

  function openAddModal() {
    document.getElementById("modalTitle").innerText = "Dodaj materiał";
    document.getElementById("materialId").value = "";
    document.getElementById("materialType").value = "Blacha";
    document.getElementById("materialSteel").value = "S355";
    document.getElementById("materialDimension").value = "";
    document.getElementById("materialLengthMm").value = "";
    document.getElementById("materialWidthMm").value = "";
    document.getElementById("materialHeightMm").value = "";
    document.getElementById("materialWallMm").value = "";
    document.getElementById("materialQuantity").value = "";
    document.getElementById("materialLocation").value = "";
    document.getElementById("materialTotalWeight").value = "";
    document.getElementById("materialExtraInfo").value = "";
    document.getElementById("modalMessage").innerHTML = "";

    updateMaterialFields();
    updateDimensionDescription();
    recalcWeightPreview();

    document.getElementById("materialModal").classList.remove("hidden");
  }

  function openEditModal(id) {
    const m = materials.find(x => x.id === id);
    if (!m) return;

    document.getElementById("modalTitle").innerText = "Edytuj materiał";
    document.getElementById("materialId").value = m.id;
    document.getElementById("materialType").value = m.typ || "Blacha";
    document.getElementById("materialSteel").value = m.gatunek || "S355";
    document.getElementById("materialDimension").value = m.wymiar || "";
    document.getElementById("materialLengthMm").value = m.dlugosc_mm ?? m.length_mm ?? "";
    document.getElementById("materialWidthMm").value = m.szerokosc_mm ?? m.width_mm ?? "";
    document.getElementById("materialHeightMm").value = m.wysokosc_mm ?? m.height_mm ?? "";
    document.getElementById("materialWallMm").value = m.grubosc_mm ?? m.wall_mm ?? "";
    document.getElementById("materialQuantity").value = m.ilosc ?? "";
    document.getElementById("materialLocation").value = m.lokalizacja || "";
    document.getElementById("materialDepartment").value = m.dzial_id ?? "";
    document.getElementById("materialTotalWeight").value = "";
    document.getElementById("materialExtraInfo").value = m.dodatkowe_informacje || "";
    document.getElementById("modalMessage").innerHTML = "";

    updateMaterialFields();
    updateDimensionDescription();
    recalcWeightPreview();
    document.getElementById("materialModal").classList.remove("hidden");
  }

  function closeModal() {
    document.getElementById("materialModal").classList.add("hidden");
  }

  async function saveMaterial() {
    const id = document.getElementById("materialId").value;
    const type = document.getElementById("materialType").value;
    const gatunek = document.getElementById("materialSteel").value;
    const dlugosc_mm = Number(document.getElementById("materialLengthMm").value || 0);
    const szerokosc_mm = Number(document.getElementById("materialWidthMm").value || 0);
    const wysokosc_mm = Number(document.getElementById("materialHeightMm").value || 0);
    const grubosc_mm = Number(document.getElementById("materialWallMm").value || 0);
    const ilosc = Number(document.getElementById("materialQuantity").value || 0);

    const dimensionDescription = buildDimensionText(type, dlugosc_mm, szerokosc_mm, wysokosc_mm, grubosc_mm);
    const calculatedMass = calcMassPerPieceKg({
      typ: type,
      gatunek,
      dlugosc_mm,
      szerokosc_mm,
      wysokosc_mm,
      grubosc_mm
    });

    const payload = {
      typ: type,
      gatunek,
      wymiar: dimensionDescription,
      dlugosc_mm,
      szerokosc_mm,
      wysokosc_mm,
      grubosc_mm,
      masa_szt_kg: calculatedMass,
      ilosc,
      lokalizacja: document.getElementById("materialLocation").value.trim(),
      dzial_id: Number(document.getElementById("materialDepartment").value || 0),
      dodatkowe_informacje: document.getElementById("materialExtraInfo").value.trim()
    };

    const message = document.getElementById("modalMessage");
    message.className = "";
    message.innerText = "Zapisywanie...";

    let result;
    if (id) {
      result = await supabaseClient.from("materialy").update(payload).eq("id", id);
    } else {
      result = await supabaseClient.from("materialy").insert(payload);
    }

    if (result.error) {
      message.className = "error";
      message.innerText = "Błąd zapisu: " + result.error.message;
      return;
    }

    message.className = "success";
    message.innerText = "Zapisano";
    await loadMaterials();
    setTimeout(closeModal, 300);
  }

  async function deleteMaterial(id) {
    if (!confirm("Czy na pewno usunąć materiał?")) return;
    const { error } = await supabaseClient.from("materialy").delete().eq("id", id);
    if (error) {
      alert("Błąd usuwania: " + error.message);
      return;
    }
    await loadMaterials();
  }

  function askPricesForUsedGrades(rows) {
    const usedGrades = [...new Set(rows.map(r => r.gatunek).filter(Boolean))];
    const prices = {};

    for (const g of usedGrades) {
      const val = prompt(`Podaj cenę za 1 kg dla gatunku: ${g}`, "0");
      const num = Number(String(val || "0").replace(',', '.'));
      prices[g] = Number.isFinite(num) ? num : 0;
    }

    return prices;
  }

  function exportExcelReport() {
    if (!materials.length) {
      alert("Brak danych do eksportu.");
      return;
    }

    const priceByGrade = askPricesForUsedGrades(materials);

    const rows = materials.map(m => {
      const qty = Number(m.ilosc || 0);
      const massPerPiece = calcMassPerPieceKg(m);
      const totalMass = massPerPiece * qty;
      const pricePerKg = Number(priceByGrade[m.gatunek] || 0);
      const value = totalMass * pricePerKg;

      return {
        Typ: m.typ || "",
        Gatunek: m.gatunek || "",
        "Wymiar [mm]": getMaterialDimensionText(m),
        Ilość: qty,
        "Masa 1 szt [kg]": Number(massPerPiece.toFixed(3)),
        "Masa całkowita [kg]": Number(totalMass.toFixed(3)),
        "Cena [zł/kg]": pricePerKg,
        "Wartość [zł]": Number(value.toFixed(2)),
        Lokalizacja: m.lokalizacja || "",
        Dział: m.dzialy?.nazwa || "",
        "Dodatkowe informacje": m.dodatkowe_informacje || ""
      };
    });

    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Raport");

    const date = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(wb, `raport_magazyn_stali_${date}.xlsx`);
  }

  startApp();
</script>

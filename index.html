<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magazyn Stali RENOX</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f6;
      color: #1f2937;
    }

    button, input, select {
      font: inherit;
    }

    .login-container {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    .login-box h1 {
      text-align: center;
      margin-top: 0;
      color: #1f2937;
    }

    .login-box p {
      text-align: center;
      color: #6b7280;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      background: white;
    }

    button {
      border: none;
      border-radius: 7px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .btn-secondary {
      background: #6b7280;
      color: white;
    }

    .btn-success {
      background: #16a34a;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    header {
      background: #111827;
      color: white;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
    }

    .app {
      max-width: 1400px;
      margin: 0 auto;
      padding: 25px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 15px;
      flex-wrap: wrap;
    }

    .top-bar h2 {
      margin: 0;
    }

    .top-bar-buttons {
      display: flex;
      gap: 10px;
    }

    .filters {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 12px;
    }

    .table-container {
      background: white;
      border-radius: 10px;
      overflow-x: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th {
      background: #e5e7eb;
      text-align: left;
      padding: 13px;
      font-size: 14px;
    }

    td {
      padding: 13px;
      border-top: 1px solid #e5e7eb;
    }

    tr:hover {
      background: #f9fafb;
    }

    .actions {
      display: flex;
      gap: 7px;
    }

    .btn-edit {
      background: #f59e0b;
      color: white;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 600px;
      padding: 25px;
      border-radius: 12px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-content h2 {
      margin-top: 0;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .error {
      color: #dc2626;
      margin-top: 10px;
      text-align: center;
    }

    .success {
      color: #15803d;
      margin-top: 10px;
      text-align: center;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .form-row-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .weight-info {
      background: #e0f2fe;
      border-left: 4px solid #0284c7;
      padding: 12px;
      border-radius: 5px;
      margin-top: 10px;
      font-size: 13px;
    }

    @media (max-width: 800px) {
      .filter-grid {
        grid-template-columns: 1fr;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
      }

      .top-bar {
        flex-direction: column;
        align-items: flex-start;
      }

      .top-bar-buttons {
        width: 100%;
        flex-direction: column;
      }

      .top-bar-buttons button {
        width: 100%;
      }

      .app {
        padding: 15px;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .form-row-3 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<!-- =========================================================
     LOGOWANIE
========================================================= -->

<div id="loginScreen" class="login-container">

  <div class="login-box">

    <h1>🏭 Magazyn Stali</h1>

    <p>Zaloguj się do systemu</p>

    <div class="form-group">

      <label>Adres e-mail</label>

      <input
        type="email"
        id="loginEmail"
        placeholder="email@firma.pl"
      >

    </div>

    <div class="form-group">

      <label>Hasło</label>

      <input
        type="password"
        id="loginPassword"
        placeholder="Hasło"
      >

    </div>

    <button
      class="btn-primary"
      style="width:100%;"
      onclick="login()"
    >
      ZALOGUJ
    </button>

    <div id="loginMessage"></div>

  </div>

</div>


<!-- =========================================================
     APLIKACJA
========================================================= -->

<div id="appScreen" class="hidden">

  <header>

    <h1>🏭 Magazyn Stali RENOX</h1>

    <div class="user-info">

      <span id="userName"></span>

      <button
        class="btn-secondary"
        onclick="logout()"
      >
        Wyloguj
      </button>

    </div>

  </header>


  <main class="app">

    <div class="top-bar">

      <h2>Materiały</h2>

      <div class="top-bar-buttons">

        <button
          class="btn-primary"
          onclick="openAddModal()"
        >
          ➕ DODAJ MATERIAŁ
        </button>

        <button
          class="btn-success"
          onclick="openExcelExportModal()"
        >
          📊 EKSPORTUJ RAPORT
        </button>

      </div>

    </div>


    <!-- =====================================================
         FILTRY
    ====================================================== -->

    <div class="filters">

      <div class="filter-grid">

        <div>

          <label>🔎 Szukaj</label>

          <input
            type="text"
            id="searchInput"
            placeholder="Typ, gatunek, wymiar, lokalizacja..."
            oninput="renderMaterials()"
          >

        </div>


        <div>

          <label>Typ</label>

          <select
            id="typeFilter"
            onchange="renderMaterials()"
          >

            <option value="">Wszystkie</option>
            <option value="Blacha">Blacha</option>
            <option value="Profil">Profil</option>
            <option value="Pręt">Pręt</option>
            <option value="Wałek">Wałek</option>
            <option value="Rura">Rura</option>
            <option value="Inne">Inne</option>

          </select>

        </div>


        <div>

          <label>Gatunek stali</label>

          <select
            id="steelFilter"
            onchange="renderMaterials()"
          >

            <option value="">Wszystkie</option>

          </select>

        </div>


        <div>

          <label>Lokalizacja</label>

          <select
            id="locationFilter"
            onchange="renderMaterials()"
          >

            <option value="">Wszystkie</option>

          </select>

        </div>

      </div>

    </div>


    <!-- =====================================================
         TABELA
    ====================================================== -->

    <div class="table-container">

      <table>

        <thead>

          <tr>

            <th>Typ</th>
            <th>Gatunek stali</th>
            <th>Wymiar</th>
            <th>Ilość</th>
            <th>Waga (kg)</th>
            <th>Lokalizacja</th>
            <th>Akcje</th>

          </tr>

        </thead>

        <tbody id="materialsTable">
        </tbody>

      </table>

    </div>

  </main>

</div>


<!-- =========================================================
     MODAL DODAWANIA / EDYCJI
========================================================= -->

<div
  id="materialModal"
  class="modal hidden"
>

  <div class="modal-content">

    <h2 id="modalTitle">
      Dodaj materiał
    </h2>


    <input
      type="hidden"
      id="materialId"
    >


    <!-- TYP -->

    <div class="form-group">

      <label>Typ</label>

      <select
        id="materialType"
        onchange="updateDimensionFields()"
      >

        <option value="Blacha">Blacha</option>
        <option value="Profil">Profil</option>
        <option value="Pręt">Pręt</option>
        <option value="Wałek">Wałek</option>
        <option value="Rura">Rura</option>
        <option value="Płaskownik">Płaskownik</option>
        <option value="Kątownik">Kątownik</option>

      </select>

    </div>


    <!-- GATUNEK -->

    <div class="form-group">

      <label>Gatunek materiału</label>

      <select id="materialSteel" onchange="updateWeightDisplay()">
        <option value="">-- Wybierz gatunek --</option>
        <option value="S235">S235</option>
        <option value="S355">S355</option>
        <option value="Aluminium">Aluminium</option>
        <option value="Stal nierdzewna 304">Stal nierdzewna 304</option>
        <option value="Stal nierdzewna 316">Stal nierdzewna 316</option>
        <option value="Corten">Corten</option>
      </select>

    </div>

    <!-- POLA WYMIAROWE - DYNAMICZNE -->

    <div id="dynamicFields">
    </div>

    <!-- INFO O WADZE -->
    <div id="weightDisplay" class="weight-info hidden">
      Waga: <strong id="weightValue">0.00 kg</strong>
    </div>


    <!-- ILOŚĆ -->

    <div class="form-group">

      <label>Ilość (szt.)</label>

      <input
        type="number"
        id="materialQuantity"
        min="0"
        step="0.01"
        placeholder="np. 5"
        onchange="updateWeightDisplay()"
      >

    </div>


    <!-- LOKALIZACJA -->

    <div class="form-group">

      <label>Lokalizacja</label>

      <input
        type="text"
        id="materialLocation"
        placeholder="np. Hala A / Regał 3"
      >

    </div>


    <!-- DZIAŁ -->

    <div class="form-group">

      <label>Dział</label>

      <select id="materialDepartment">
      </select>

    </div>


    <div id="modalMessage"></div>


    <div class="modal-buttons">

      <button
        class="btn-secondary"
        onclick="closeModal()"
      >
        Anuluj
      </button>

      <button
        class="btn-primary"
        onclick="saveMaterial()"
      >
        Zapisz
      </button>

    </div>

  </div>

</div>


<!-- =========================================================
     MODAL EKSPORTU EXCEL
========================================================= -->

<div
  id="exportModal"
  class="modal hidden"
>

  <div class="modal-content">

    <h2>Eksport Raportu - Ustal ceny za kg</h2>

    <p style="color: #6b7280; font-size: 14px;">Podaj ceny za kilogram dla każdego gatunku stali:</p>

    <div id="priceInputs">
    </div>

    <div id="exportMessage"></div>

    <div class="modal-buttons">

      <button
        class="btn-secondary"
        onclick="closeExcelExportModal()"
      >
        Anuluj
      </button>

      <button
        class="btn-success"
        onclick="generateExcelReport()"
      >
        Generuj Excel
      </button>

    </div>

  </div>

</div>


<script>

  // =========================================================
  // GĘSTOŚĆ MATERIAŁÓW (kg/m³)
  // =========================================================

  const materialDensity = {
    "S235": 7850,
    "S355": 7850,
    "Aluminium": 2700,
    "Stal nierdzewna 304": 8000,
    "Stal nierdzewna 316": 8000,
    "Corten": 7850
  };


  // =========================================================
  // WYMIARY MATERIAŁÓW - DEFINICJA
  // =========================================================

  const materialDimensions = {
    "Blacha": {
      fields: [
        { id: "dim_length", label: "Długość (mm)", name: "wymiar_dlugosc" },
        { id: "dim_width", label: "Szerokość (mm)", name: "wymiar_szerokosc" },
        { id: "dim_thickness", label: "Grubość (mm)", name: "wymiar_grubosc" }
      ],
      calcWeight: (fields) => {
        const length = (fields.wymiar_dlugosc || 0) / 1000;
        const width = (fields.wymiar_szerokosc || 0) / 1000;
        const thickness = (fields.wymiar_grubosc || 0) / 1000;
        return length * width * thickness;
      }
    },
    "Profil": {
      fields: [
        { id: "dim_height", label: "Wysokość (mm)", name: "wymiar_wysokosc" },
        { id: "dim_width", label: "Szerokość (mm)", name: "wymiar_szerokosc" },
        { id: "dim_thickness", label: "Grubość (mm)", name: "wymiar_grubosc" }
      ],
      calcWeight: (fields) => {
        const height = (fields.wymiar_wysokosc || 0) / 1000;
        const width = (fields.wymiar_szerokosc || 0) / 1000;
        const thickness = (fields.wymiar_grubosc || 0) / 1000;
        return height * width * thickness;
      }
    },
    "Pręt": {
      fields: [
        { id: "dim_diameter", label: "Średnica (mm)", name: "wymiar_srednica" },
        { id: "dim_length", label: "Długość (mm)", name: "wymiar_dlugosc" }
      ],
      calcWeight: (fields) => {
        const diameter = (fields.wymiar_srednica || 0) / 1000;
        const length = (fields.wymiar_dlugosc || 0) / 1000;
        const radius = diameter / 2;
        return Math.PI * radius * radius * length;
      }
    },
    "Wałek": {
      fields: [
        { id: "dim_diameter", label: "Średnica (mm)", name: "wymiar_srednica" },
        { id: "dim_length", label: "Długość (mm)", name: "wymiar_dlugosc" }
      ],
      calcWeight: (fields) => {
        const diameter = (fields.wymiar_srednica || 0) / 1000;
        const length = (fields.wymiar_dlugosc || 0) / 1000;
        const radius = diameter / 2;
        return Math.PI * radius * radius * length;
      }
    },
    "Rura": {
      fields: [
        { id: "dim_outer_diameter", label: "Średnica zewnętrzna (mm)", name: "wymiar_srednicy_zew" },
        { id: "dim_wall_thickness", label: "Grubość ścianki (mm)", name: "wymiar_grubosc_scianki" },
        { id: "dim_length", label: "Długość (mm)", name: "wymiar_dlugosc" }
      ],
      calcWeight: (fields) => {
        const outerDiam = (fields.wymiar_srednicy_zew || 0) / 1000;
        const wallThickness = (fields.wymiar_grubosc_scianki || 0) / 1000;
        const length = (fields.wymiar_dlugosc || 0) / 1000;
        const outerRadius = outerDiam / 2;
        const innerRadius = outerRadius - wallThickness;
        return Math.PI * (outerRadius * outerRadius - innerRadius * innerRadius) * length;
      }
    },
    "Płaskownik": {
      fields: [
        { id: "dim_dim_a", label: "Wymiar A (mm)", name: "wymiar_a" },
        { id: "dim_dim_b", label: "Wymiar B (mm)", name: "wymiar_b" },
        { id: "dim_length", label: "Długość (mm)", name: "wymiar_dlugosc" }
      ],
      calcWeight: (fields) => {
        const dimA = (fields.wymiar_a || 0) / 1000;
        const dimB = (fields.wymiar_b || 0) / 1000;
        const length = (fields.wymiar_dlugosc || 0) / 1000;
        return dimA * dimB * length;
      }
    },
    "Kątownik": {
      fields: [
        { id: "dim_dim_a", label: "Wymiar A (mm)", name: "wymiar_a" },
        { id: "dim_dim_b", label: "Wymiar B (mm)", name: "wymiar_b" },
        { id: "dim_wall_thickness", label: "Grubość ścianki (mm)", name: "wymiar_grubosc_scianki" },
        { id: "dim_length", label: "Długość (mm)", name: "wymiar_dlugosc" }
      ],
      calcWeight: (fields) => {
        const dimA = (fields.wymiar_a || 0) / 1000;
        const dimB = (fields.wymiar_b || 0) / 1000;
        const wallThickness = (fields.wymiar_grubosc_scianki || 0) / 1000;
        const length = (fields.wymiar_dlugosc || 0) / 1000;
        const volume = (dimA + dimB - wallThickness) * wallThickness * length;
        return volume;
      }
    },
    "Inne": {
      fields: [
        { id: "dim_custom", label: "Waga (kg)", name: "waga_kg" }
      ],
      calcWeight: (fields) => {
        return fields.waga_kg || 0;
      }
    }
  };

  const materialColumnAliases = {
    wymiar: ["wymiary"],
    wymiar_dlugosc: ["dlugosc"],
    wymiar_szerokosc: ["szerokosc"],
    wymiar_grubosc: ["grubosc"],
    wymiar_wysokosc: ["wysokosc"],
    wymiar_srednica: ["srednica"],
    wymiar_srednicy_zew: ["srednica_zew", "srednica_zewnetrzna"],
    wymiar_grubosc_scianki: ["grubosc_scianki"],
    wymiar_a: ["a"],
    wymiar_b: ["b"],
    waga_kg: ["waga"]
  };

  let materialColumnNames = new Set();

  function registerMaterialColumns(rows) {
    rows.forEach(row => {
      Object.keys(row || {}).forEach(key => materialColumnNames.add(key));
    });
  }

  function resolveMaterialColumnName(fieldName, useAliasFallback = false) {
    const aliases = materialColumnAliases[fieldName] || [];

    if (materialColumnNames.size > 0) {
      const candidates = [fieldName, ...aliases];
      const matchedColumn = candidates.find(candidate => materialColumnNames.has(candidate));
      if (matchedColumn) {
        return matchedColumn;
      }
    }

    if (useAliasFallback && aliases.length > 0) {
      return aliases[0];
    }

    return fieldName;
  }

  function setMaterialFieldValue(materialData, fieldName, value, useAliasFallback = false) {
    const aliases = materialColumnAliases[fieldName] || [];
    const resolvedFieldName = resolveMaterialColumnName(fieldName, useAliasFallback);
    materialData[resolvedFieldName] = value;

    if (materialColumnNames.size > 0) {
      if (materialColumnNames.has(fieldName)) {
        materialData[fieldName] = value;
      }
      aliases.forEach(alias => {
        if (materialColumnNames.has(alias)) {
          materialData[alias] = value;
        }
      });
    }
  }

  function getMaterialFieldValue(material, fieldName) {
    const aliases = materialColumnAliases[fieldName] || [];
    const candidates = [fieldName, ...aliases];
    for (const candidate of candidates) {
      if (material[candidate] !== undefined && material[candidate] !== null) {
        return material[candidate];
      }
    }
    return null;
  }

  function shouldRetryWithAliasColumns(error) {
    if (!error) return false;
    const details = (error.details || "").toString();
    return error.code === "PGRST204" || details.includes("Could not find") || details.includes("column of 'materialy'");
  }


  const SUPABASE_URL = "https://ynmcfagoxshigqbcgvkb.supabase.co";
  const SUPABASE_KEY = "sb_publishable_PCfv8KZPMsfqNwuZkBXj0A_zPxIcPZi";

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let materials = [];
  let departments = [];
  let currentUser = null;


  async function startApp() {
    const { data } = await supabaseClient.auth.getSession();
    if (data.session) {
      currentUser = data.session.user;
      await showApplication();
    } else {
      showLogin();
    }
  }


  async function login() {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const message = document.getElementById("loginMessage");

    message.className = "";
    message.innerText = "Logowanie...";

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      message.className = "error";
      message.innerText = "Błąd logowania: " + error.message;
      return;
    }

    currentUser = data.user;
    await showApplication();
  }


  async function logout() {
    await supabaseClient.auth.signOut();
    currentUser = null;
    showLogin();
  }


  function showLogin() {
    document.getElementById("loginScreen").classList.remove("hidden");
    document.getElementById("appScreen").classList.add("hidden");
  }


  async function showApplication() {
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("appScreen").classList.remove("hidden");
    document.getElementById("userName").innerText = currentUser.email || "Użytkownik";
    await loadDepartments();
    await loadMaterials();
  }


  async function loadDepartments() {
    const { data, error } = await supabaseClient.from("dzialy").select("*");
    if (error) {
      alert("Błąd pobierania działów: " + error.message);
      return;
    }
    departments = data || [];
    updateDepartmentSelect();
  }


  function updateDepartmentSelect() {
    const select = document.getElementById("materialDepartment");
    select.innerHTML = "";
    departments.forEach(department => {
      const option = document.createElement("option");
      option.value = department.id;
      option.textContent = department.nazwa;
      select.appendChild(option);
    });
  }


  async function loadMaterials() {
    const { data, error } = await supabaseClient.from("materialy").select(`*, dzialy (nazwa)`).order("id", { ascending: false });
    if (error) {
      alert("Błąd pobierania materiałów: " + error.message);
      return;
    }
    materials = data || [];
    registerMaterialColumns(materials);
    updateFilters();
    renderMaterials();
  }


  function calculateWeight(material) {
    const type = material.typ;
    const steel = material.gatunek;
    if (!type || !steel || !materialDimensions[type]) {
      return 0;
    }
    const dimConfig = materialDimensions[type];
    const volume = dimConfig.calcWeight(material) || 0;
    const density = materialDensity[steel] || 7850;
    return volume * density;
  }


  function updateFilters() {
    const steelSelect = document.getElementById("steelFilter");
    const locationSelect = document.getElementById("locationFilter");
    const steels = [...new Set(materials.map(m => m.gatunek).filter(Boolean))].sort();
    const locations = [...new Set(materials.map(m => m.lokalizacja).filter(Boolean))].sort();
    const currentSteel = steelSelect.value;
    const currentLocation = locationSelect.value;

    steelSelect.innerHTML = '<option value="">Wszystkie</option>';
    steels.forEach(steel => {
      const option = document.createElement("option");
      option.value = steel;
      option.textContent = steel;
      steelSelect.appendChild(option);
    });
    steelSelect.value = currentSteel;

    locationSelect.innerHTML = '<option value="">Wszystkie</option>';
    locations.forEach(location => {
      const option = document.createElement("option");
      option.value = location;
      option.textContent = location;
      locationSelect.appendChild(option);
    });
    locationSelect.value = currentLocation;
  }


  function renderMaterials() {
    const search = document.getElementById("searchInput").value.toLowerCase();
    const typeFilter = document.getElementById("typeFilter").value;
    const steelFilter = document.getElementById("steelFilter").value;
    const locationFilter = document.getElementById("locationFilter").value;

    const filtered = materials.filter(m => {
      const materialDimension = getMaterialFieldValue(m, "wymiar");
      const matchType = !typeFilter || m.typ === typeFilter;
      const matchSteel = !steelFilter || m.gatunek === steelFilter;
      const matchLocation = !locationFilter || m.lokalizacja === locationFilter;
      const matchSearch = !search || (m.typ && m.typ.toLowerCase().includes(search)) || 
                         (m.gatunek && m.gatunek.toLowerCase().includes(search)) || 
                         (materialDimension && materialDimension.toString().toLowerCase().includes(search)) || 
                         (m.lokalizacja && m.lokalizacja.toLowerCase().includes(search));
      return matchType && matchSteel && matchLocation && matchSearch;
    });

    const tbody = document.getElementById("materialsTable");
    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty">Brak materiałów spełniających kryteria</td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map(m => {
      const materialDimension = getMaterialFieldValue(m, "wymiar");
      const weight = calculateWeight(m);
      const totalWeight = weight * (m.ilosc || 1);
      return `
        <tr>
          <td>${m.typ}</td>
          <td>${m.gatunek}</td>
          <td>${materialDimension || '-'}</td>
          <td>${m.ilosc}</td>
          <td>${totalWeight.toFixed(2)}</td>
          <td>${m.lokalizacja}</td>
          <td class="actions">
            <button class="btn-edit" onclick="editMaterial(${m.id})">✏️ Edytuj</button>
            <button class="btn-danger" onclick="deleteMaterial(${m.id})">🗑️ Usuń</button>
          </td>
        </tr>
      `;
    }).join("");
  }


  function updateDimensionFields() {
    const type = document.getElementById("materialType").value;
    const dynamicFields = document.getElementById("dynamicFields");
    dynamicFields.innerHTML = "";
    const dims = materialDimensions[type];
    if (!dims) return;

    if (dims.fields.length === 2) {
      const row = document.createElement("div");
      row.className = "form-row";
      dims.fields.forEach(field => {
        const group = document.createElement("div");
        group.className = "form-group";
        group.innerHTML = `<label>${field.label}</label><input type="number" id="${field.id}" min="0" step="0.01" placeholder="np. 100" onchange="updateWeightDisplay()">`;
        row.appendChild(group);
      });
      dynamicFields.appendChild(row);
    } else if (dims.fields.length === 3) {
      const row = document.createElement("div");
      row.className = "form-row-3";
      dims.fields.forEach(field => {
        const group = document.createElement("div");
        group.className = "form-group";
        group.innerHTML = `<label>${field.label}</label><input type="number" id="${field.id}" min="0" step="0.01" placeholder="np. 100" onchange="updateWeightDisplay()">`;
        row.appendChild(group);
      });
      dynamicFields.appendChild(row);
    } else if (dims.fields.length === 4) {
      for (let i = 0; i < dims.fields.length; i += 2) {
        const row = document.createElement("div");
        row.className = "form-row";
        for (let j = i; j < i + 2 && j < dims.fields.length; j++) {
          const field = dims.fields[j];
          const group = document.createElement("div");
          group.className = "form-group";
          group.innerHTML = `<label>${field.label}</label><input type="number" id="${field.id}" min="0" step="0.01" placeholder="np. 100" onchange="updateWeightDisplay()">`;
          row.appendChild(group);
        }
        dynamicFields.appendChild(row);
      }
    } else {
      dims.fields.forEach(field => {
        const group = document.createElement("div");
        group.className = "form-group";
        group.innerHTML = `<label>${field.label}</label><input type="number" id="${field.id}" min="0" step="0.01" placeholder="np. 100" onchange="updateWeightDisplay()">`;
        dynamicFields.appendChild(group);
      });
    }
  }


  function updateWeightDisplay() {
    const type = document.getElementById("materialType").value;
    const steel = document.getElementById("materialSteel").value;
    const quantity = parseFloat(document.getElementById("materialQuantity").value) || 1;

    if (!type || !steel) {
      document.getElementById("weightDisplay").classList.add("hidden");
      return;
    }

    const dims = materialDimensions[type];
    if (!dims) {
      document.getElementById("weightDisplay").classList.add("hidden");
      return;
    }

    const fieldData = {};
    dims.fields.forEach(field => {
      const input = document.getElementById(field.id);
      fieldData[field.name] = input ? parseFloat(input.value) || 0 : 0;
    });

    const volume = dims.calcWeight(fieldData) || 0;
    const density = materialDensity[steel] || 7850;
    const weight = volume * density;
    const totalWeight = weight * quantity;

    const weightDisplay = document.getElementById("weightDisplay");
    weightDisplay.classList.remove("hidden");
    document.getElementById("weightValue").innerText = totalWeight.toFixed(2) + " kg";
  }


  function openAddModal() {
    document.getElementById("materialId").value = "";
    document.getElementById("modalTitle").innerText = "Dodaj materiał";
    document.getElementById("materialType").value = "Blacha";
    document.getElementById("materialSteel").value = "";
    document.getElementById("materialQuantity").value = "";
    document.getElementById("materialLocation").value = "";
    document.getElementById("materialDepartment").value = departments[0]?.id || "";
    document.getElementById("modalMessage").innerHTML = "";
    updateDimensionFields();
    document.getElementById("materialModal").classList.remove("hidden");
  }


  function editMaterial(id) {
    const material = materials.find(m => m.id === id);
    if (!material) return;

    document.getElementById("materialId").value = material.id;
    document.getElementById("modalTitle").innerText = "Edytuj materiał";
    document.getElementById("materialType").value = material.typ;
    document.getElementById("materialSteel").value = material.gatunek;
    document.getElementById("materialQuantity").value = material.ilosc;
    document.getElementById("materialLocation").value = material.lokalizacja;
    document.getElementById("materialDepartment").value = material.dzial_id;
    document.getElementById("modalMessage").innerHTML = "";
    updateDimensionFields();

    setTimeout(() => {
      const dims = materialDimensions[material.typ];
      if (dims) {
        dims.fields.forEach(field => {
          const input = document.getElementById(field.id);
          const fieldValue = getMaterialFieldValue(material, field.name);
          if (input && fieldValue !== null) {
            input.value = fieldValue;
          }
        });
      }
      updateWeightDisplay();
    }, 0);

    document.getElementById("materialModal").classList.remove("hidden");
  }


  function closeModal() {
    document.getElementById("materialModal").classList.add("hidden");
  }


  async function saveMaterial() {
    const materialId = document.getElementById("materialId").value;
    const type = document.getElementById("materialType").value;
    const steel = document.getElementById("materialSteel").value;
    
    const quantityValue = document.getElementById("materialQuantity").value.trim();
    const quantity = quantityValue === "" ? null : parseFloat(quantityValue);

    const location = document.getElementById("materialLocation").value;
    const departmentId = document.getElementById("materialDepartment").value;
    const messageDiv = document.getElementById("modalMessage");

    // FIXED: Proper validation that catches all invalid cases
    if (!type || !steel || quantity === null || isNaN(quantity) || quantity < 0 || !location || !departmentId) {
      messageDiv.className = "error";
      messageDiv.innerText = "Wypełnij wszystkie pola prawidłowo";
      return;
    }

    const dims = materialDimensions[type];
    let wymiarSummary = [];
    const baseMaterialData = {
      typ: type,
      gatunek: steel,
      ilosc: quantity,
      lokalizacja: location,
      dzial_id: departmentId
    };

    const buildMaterialData = (useAliasFallback = false) => {
      const materialData = { ...baseMaterialData };
      wymiarSummary = [];

      dims.fields.forEach(field => {
        const input = document.getElementById(field.id);
        const value = input ? parseFloat(input.value) || 0 : 0;
        setMaterialFieldValue(materialData, field.name, value, useAliasFallback);
        if (value > 0) {
          wymiarSummary.push(value);
        }
      });

      setMaterialFieldValue(materialData, "wymiar", wymiarSummary.join(" x ") || "-", useAliasFallback);
      return materialData;
    };

    const saveToDatabase = async (payload) => {
      if (materialId) {
        return await supabaseClient
          .from("materialy")
          .update(payload)
          .eq("id", materialId);
      }

      return await supabaseClient
        .from("materialy")
        .insert([payload]);
    };

    messageDiv.className = "";
    messageDiv.innerText = "Zapisywanie...";

    let { error } = await saveToDatabase(buildMaterialData(false));
    if (shouldRetryWithAliasColumns(error)) {
      ({ error } = await saveToDatabase(buildMaterialData(true)));
    }

    if (error) {
      messageDiv.className = "error";
      messageDiv.innerText = "Błąd: " + error.message;
      return;
    }

    messageDiv.className = "success";
    messageDiv.innerText = "Materiał zapisany!";

    setTimeout(() => {
      closeModal();
      loadMaterials();
    }, 1000);
  }


  async function deleteMaterial(id) {
    if (!confirm("Czy na pewno chcesz usunąć ten materiał?")) return;

    const { error } = await supabaseClient.from("materialy").delete().eq("id", id);

    if (error) {
      alert("Błąd usuwania: " + error.message);
      return;
    }

    loadMaterials();
  }


  function openExcelExportModal() {
    const steels = [...new Set(materials.map(m => m.gatunek).filter(Boolean))].sort();
    const priceInputs = document.getElementById("priceInputs");
    priceInputs.innerHTML = "";

    steels.forEach(steel => {
      const group = document.createElement("div");
      group.className = "form-group";
      group.innerHTML = `<label>Cena za kg - ${steel}</label><input type="number" id="price_${steel}" min="0" step="0.01" placeholder="0.00">`;
      priceInputs.appendChild(group);
    });

    document.getElementById("exportModal").classList.remove("hidden");
  }


  function closeExcelExportModal() {
    document.getElementById("exportModal").classList.add("hidden");
  }


  function generateExcelReport() {
    const steels = [...new Set(materials.map(m => m.gatunek).filter(Boolean))].sort();
    const prices = {};
    
    steels.forEach(steel => {
      const input = document.getElementById(`price_${steel}`);
      prices[steel] = parseFloat(input.value) || 0;
    });

    const reportData = materials.map(m => {
      const materialDimension = getMaterialFieldValue(m, "wymiar");
      const weight = calculateWeight(m);
      const totalWeight = weight * (m.ilosc || 1);
      const price = prices[m.gatunek] || 0;
      const value = totalWeight * price;

      return {
        "Typ": m.typ,
        "Gatunek": m.gatunek,
        "Wymiar": materialDimension || "-",
        "Ilość (szt)": m.ilosc,
        "Waga jednostkowa (kg)": weight.toFixed(2),
        "Waga całkowita (kg)": totalWeight.toFixed(2),
        "Cena/kg (PLN)": price.toFixed(2),
        "Wartość (PLN)": value.toFixed(2),
        "Lokalizacja": m.lokalizacja
      };
    });

    const ws = XLSX.utils.json_to_sheet(reportData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Raport");
    XLSX.writeFile(wb, "Raport_Materialy.xlsx");

    closeExcelExportModal();
  }


  window.addEventListener("load", startApp);

</script>

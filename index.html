<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magazyn Stali RENOX</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f6;
      color: #1f2937;
    }

    button, input, select {
      font: inherit;
    }

    .login-container {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    .login-box h1 {
      text-align: center;
      margin-top: 0;
      color: #1f2937;
    }

    .login-box p {
      text-align: center;
      color: #6b7280;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      background: white;
    }

    button {
      border: none;
      border-radius: 7px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .btn-secondary {
      background: #6b7280;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    header {
      background: #111827;
      color: white;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
    }

    .app {
      max-width: 1400px;
      margin: 0 auto;
      padding: 25px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 15px;
    }

    .top-bar h2 {
      margin: 0;
    }

    .filters {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 12px;
    }

    .table-container {
      background: white;
      border-radius: 10px;
      overflow-x: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th {
      background: #e5e7eb;
      text-align: left;
      padding: 13px;
      font-size: 14px;
    }

    td {
      padding: 13px;
      border-top: 1px solid #e5e7eb;
    }

    tr:hover {
      background: #f9fafb;
    }

    .actions {
      display: flex;
      gap: 7px;
    }

    .btn-edit {
      background: #f59e0b;
      color: white;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 500px;
      padding: 25px;
      border-radius: 12px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-content h2 {
      margin-top: 0;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .error {
      color: #dc2626;
      margin-top: 10px;
      text-align: center;
    }

    .success {
      color: #15803d;
      margin-top: 10px;
      text-align: center;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }

    @media (max-width: 800px) {
      .filter-grid {
        grid-template-columns: 1fr;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
      }

      .top-bar {
        flex-direction: column;
        align-items: flex-start;
      }

      .app {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

<!-- =========================================================
     LOGOWANIE
========================================================= -->

<div id="loginScreen" class="login-container">

  <div class="login-box">

    <h1>🏭 Magazyn Stali</h1>

    <p>Zaloguj się do systemu</p>

    <div class="form-group">

      <label>Adres e-mail</label>

      <input
        type="email"
        id="loginEmail"
        placeholder="email@firma.pl"
      >

    </div>

    <div class="form-group">

      <label>Hasło</label>

      <input
        type="password"
        id="loginPassword"
        placeholder="Hasło"
      >

    </div>

    <button
      class="btn-primary"
      style="width:100%;"
      onclick="login()"
    >
      ZALOGUJ
    </button>

    <div id="loginMessage"></div>

  </div>

</div>


<!-- =========================================================
     APLIKACJA
========================================================= -->

<div id="appScreen" class="hidden">

  <header>

    <h1>🏭 Magazyn Stali RENOX</h1>

    <div class="user-info">

      <span id="userName"></span>

      <button
        class="btn-secondary"
        onclick="logout()"
      >
        Wyloguj
      </button>

    </div>

  </header>


  <main class="app">

    <div class="top-bar">

      <h2>Materiały</h2>

      <button
        class="btn-primary"
        onclick="openAddModal()"
      >
        + DODAJ MATERIAŁ
      </button>

    </div>


    <!-- =====================================================
         FILTRY
    ====================================================== -->

    <div class="filters">

      <div class="filter-grid">

        <div>

          <label>🔎 Szukaj</label>

          <input
            type="text"
            id="searchInput"
            placeholder="Typ, gatunek, wymiar, lokalizacja..."
            oninput="renderMaterials()"
          >

        </div>


        <div>

          <label>Typ</label>

          <select
            id="typeFilter"
            onchange="renderMaterials()"
          >

            <option value="">Wszystkie</option>
            <option value="Blacha">Blacha</option>
            <option value="Profil">Profil</option>
            <option value="Pręt">Pręt</option>
            <option value="Wałek">Wałek</option>
            <option value="Rura">Rura</option>
            <option value="Inne">Inne</option>

          </select>

        </div>


        <div>

          <label>Gatunek stali</label>

          <select
            id="steelFilter"
            onchange="renderMaterials()"
          >

            <option value="">Wszystkie</option>

          </select>

        </div>


        <div>

          <label>Lokalizacja</label>

          <select
            id="locationFilter"
            onchange="renderMaterials()"
          >

            <option value="">Wszystkie</option>

          </select>

        </div>

      </div>

    </div>


    <!-- =====================================================
         TABELA
    ====================================================== -->

    <div class="table-container">

      <table>

        <thead>

          <tr>

            <th>Typ</th>
            <th>Gatunek stali</th>
            <th>Wymiar</th>
            <th>Ilość</th>
            <th>Lokalizacja</th>
            <th>Akcje</th>

          </tr>

        </thead>

        <tbody id="materialsTable">
        </tbody>

      </table>

    </div>

  </main>

</div>


<!-- =========================================================
     MODAL DODAWANIA / EDYCJI
========================================================= -->

<div
  id="materialModal"
  class="modal hidden"
>

  <div class="modal-content">

    <h2 id="modalTitle">
      Dodaj materiał
    </h2>


    <input
      type="hidden"
      id="materialId"
    >


    <!-- TYP -->

    <div class="form-group">

      <label>Typ</label>

      <select
        id="materialType"
        onchange="updateThicknessField()"
      >

        <option value="Blacha">Blacha</option>
        <option value="Profil">Profil</option>
        <option value="Pręt">Pręt</option>
        <option value="Wałek">Wałek</option>
        <option value="Rura">Rura</option>
        <option value="Płaskownik">Płaskownik</option>
        <option value="Kątownik">Kątownik</option>

      </select>

    </div>


    <!-- GATUNEK -->

    <div class="form-group">

      <label>Gatunek materiału</label>

      <select id="materialSteel">
        <option value="">-- Wybierz gatunek --</option>
        <option value="S235">S235</option>
        <option value="S355">S355</option>
        <option value="Aluminium">Aluminium</option>
        <option value="Stal nierdzewna 304">Stal nierdzewna 304</option>
        <option value="Stal nierdzewna 316">Stal nierdzewna 316</option>
        <option value="Corten">Corten</option>
      </select>

    </div>

    <!-- POLA WYMIAROWE -->

    <input
      type="hidden"
      id="materialDimension"
    >

    <div id="dynamicFields">

      <div class="form-group">
        <label>Długość (mm)</label>
        <input type="number" id="materialLength" min="0" step="0.1">
      </div>

    </div>
    
    <!-- GRUBOŚĆ -->

    <div
      class="form-group"
      id="thicknessGroup"
    >

      <label id="thicknessLabel">
        Grubość
      </label>

      <input
        type="number"
        id="materialThickness"
        min="0"
        step="0.1"
        placeholder="np. 3.0"
      >

    </div>


    <!-- ILOŚĆ -->

    <div class="form-group">

      <label>Ilość</label>

      <input
        type="number"
        id="materialQuantity"
        min="0"
        step="0.01"
        placeholder="np. 12"
      >

    </div>


    <!-- LOKALIZACJA -->

    <div class="form-group">

      <label>Lokalizacja</label>

      <input
        type="text"
        id="materialLocation"
        placeholder="np. Hala A / Regał 3"
      >

    </div>


    <!-- DZIAŁ -->

    <div class="form-group">

      <label>Dział</label>

      <select id="materialDepartment">
      </select>

    </div>


    <div id="modalMessage"></div>


    <div class="modal-buttons">

      <button
        class="btn-secondary"
        onclick="closeModal()"
      >
        Anuluj
      </button>

      <button
        class="btn-primary"
        onclick="saveMaterial()"
      >
        Zapisz
      </button>

    </div>

  </div>

</div>


<script>

  // =========================================================
  // KONFIGURACJA SUPABASE
  // =========================================================

  const SUPABASE_URL =
    "https://ynmcfagoxshigqbcgvkb.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_PCfv8KZPMsfqNwuZkBXj0A_zPxIcPZi";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  let materials = [];

  let departments = [];

  let currentUser = null;


  // =========================================================
  // START APLIKACJI
  // =========================================================

  async function startApp() {

    const { data } =
      await supabaseClient.auth.getSession();


    if (data.session) {

      currentUser =
        data.session.user;

      await showApplication();

    } else {

      showLogin();

    }

  }


  // =========================================================
  // LOGOWANIE
  // =========================================================

  async function login() {

    const email =
      document
        .getElementById("loginEmail")
        .value
        .trim();


    const password =
      document
        .getElementById("loginPassword")
        .value;


    const message =
      document.getElementById("loginMessage");


    message.className = "";

    message.innerText =
      "Logowanie...";


    const { data, error } =
      await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

      });


    if (error) {

      message.className =
        "error";

      message.innerText =
        "Błąd logowania: " +
        error.message;

      return;

    }


    currentUser =
      data.user;


    await showApplication();

  }


  // =========================================================
  // WYLOGOWANIE
  // =========================================================

  async function logout() {

    await supabaseClient.auth.signOut();

    currentUser = null;

    showLogin();

  }


  function showLogin() {

    document
      .getElementById("loginScreen")
      .classList
      .remove("hidden");


    document
      .getElementById("appScreen")
      .classList
      .add("hidden");

  }


  // =========================================================
  // POKAZANIE APLIKACJI
  // =========================================================

  async function showApplication() {

    document
      .getElementById("loginScreen")
      .classList
      .add("hidden");


    document
      .getElementById("appScreen")
      .classList
      .remove("hidden");


    document.getElementById("userName").innerText =
      currentUser.email;


    await loadDepartments();

    await loadMaterials();

  }


  // =========================================================
  // DZIAŁY
  // =========================================================

  async function loadDepartments() {

    const { data, error } =
      await supabaseClient
        .from("dzialy")
        .select("*")
        .order("nazwa");


    if (error) {

      alert(
        "Błąd pobierania działów: " +
        error.message
      );

      return;

    }


    departments =
      data || [];


    const select =
      document.getElementById(
        "materialDepartment"
      );


    select.innerHTML = "";


    departments.forEach(
      department => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          department.id;


        option.textContent =
          department.nazwa;


        select.appendChild(
          option
        );

      }
    );

  }


  // =========================================================
  // MATERIAŁY
  // =========================================================

  async function loadMaterials() {

    const { data, error } =
      await supabaseClient
        .from("materialy")
        .select(`
          *,
          dzialy (
            nazwa
          )
        `)
        .order(
          "id",
          {
            ascending: false
          }
        );


    if (error) {

      alert(
        "Błąd pobierania materiałów: " +
        error.message
      );

      return;

    }


    materials =
      data || [];


    updateFilters();

    renderMaterials();

  }


  // =========================================================
  // FILTRY
  // =========================================================

  function updateFilters() {

    const steelSelect =
      document.getElementById(
        "steelFilter"
      );


    const locationSelect =
      document.getElementById(
        "locationFilter"
      );


    const steels =
      [
        ...new Set(
          materials
            .map(
              m => m.gatunek
            )
            .filter(Boolean)
        )
      ].sort();


    const locations =
      [
        ...new Set(
          materials
            .map(
              m => m.lokalizacja
            )
            .filter(Boolean)
        )
      ].sort();


    const currentSteel =
      steelSelect.value;


    const currentLocation =
      locationSelect.value;


    steelSelect.innerHTML =
      '<option value="">Wszystkie</option>';


    steels.forEach(
      steel => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          steel;


        option.textContent =
          steel;


        steelSelect.appendChild(
          option
        );

      }
    );


    steelSelect.value =
      currentSteel;


    locationSelect.innerHTML =
      '<option value="">Wszystkie</option>';


    locations.forEach(
      location => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          location;


        option.textContent =
          location;


        locationSelect.appendChild(
          option
        );

      }
    );


    locationSelect.value =
      currentLocation;

  }


  // =========================================================
  // RENDEROWANIE MATERIAŁÓW
  // =========================================================

  function renderMaterials() {

    const search =
      document
        .getElementById("searchInput")
        .value
        .toLowerCase();


    const typeFilter =
      document
        .getElementById("typeFilter")
        .value;


    const steelFilter =
      document
        .getElementById("steelFilter")
        .value;


    const locationFilter =
      document
        .getElementById("locationFilter")
        .value;


    const filtered =
      materials.filter(
        m => {

          const matchType =
            !typeFilter ||
            m.typ === typeFilter;


          const matchSteel =
            !steelFilter ||
            m.gatunek === steelFilter;


          const matchLocation =
            !locationFilter ||
            m.lokalizacja === locationFilter;


          const matchSearch =
            !search ||
            (m.typ &&
              m.typ.toLowerCase().includes(search)) ||
            (m.gatunek &&
              m.gatunek.toLowerCase().includes(search)) ||
            (m.wymiar &&
              m.wymiar.toString().toLowerCase().includes(search)) ||
            (m.lokalizacja &&
              m.lokalizacja.toLowerCase().includes(search));


          return matchType &&
            matchSteel &&
            matchLocation &&
            matchSearch;

        }
      );


    const tbody =
      document.getElementById(
        "materialsTable"
      );


    if (filtered.length === 0) {

      tbody.innerHTML =
        '<tr><td colspan="6" class="empty">Brak materiałów spełniających kryteria</td></tr>';

      return;

    }


    tbody.innerHTML =
      filtered
        .map(
          m => `
            <tr>
              <td>${m.typ}</td>
              <td>${m.gatunek}</td>
              <td>${m.wymiar || '-'}</td>
              <td>${m.ilosc}</td>
              <td>${m.lokalizacja}</td>
              <td class="actions">
                <button class="btn-edit" onclick="editMaterial(${m.id})">✏️ Edytuj</button>
                <button class="btn-danger" onclick="deleteMaterial(${m.id})">🗑️ Usuń</button>
              </td>
            </tr>
          `
        )
        .join("");

  }


  // =========================================================
  // MODAL - DODAWANIE MATERIAŁU
  // =========================================================

  function openAddModal() {

    document.getElementById("materialId").value = "";
    document.getElementById("modalTitle").innerText = "Dodaj materiał";
    document.getElementById("materialType").value = "Blacha";
    document.getElementById("materialSteel").value = "";
    document.getElementById("materialLength").value = "";
    document.getElementById("materialThickness").value = "";
    document.getElementById("materialQuantity").value = "";
    document.getElementById("materialLocation").value = "";
    document.getElementById("materialDepartment").value = departments[0]?.id || "";
    document.getElementById("modalMessage").innerHTML = "";

    document
      .getElementById("materialModal")
      .classList
      .remove("hidden");

  }


  // =========================================================
  // MODAL - EDYCJA MATERIAŁU
  // =========================================================

  function editMaterial(id) {

    const material =
      materials.find(
        m => m.id === id
      );


    if (!material) {

      return;

    }


    document.getElementById("materialId").value = material.id;
    document.getElementById("modalTitle").innerText = "Edytuj materiał";
    document.getElementById("materialType").value = material.typ;
    document.getElementById("materialSteel").value = material.gatunek;
    document.getElementById("materialLength").value = material.wymiar || "";
    document.getElementById("materialThickness").value = material.grubosc || "";
    document.getElementById("materialQuantity").value = material.ilosc;
    document.getElementById("materialLocation").value = material.lokalizacja;
    document.getElementById("materialDepartment").value = material.dzial_id;
    document.getElementById("modalMessage").innerHTML = "";

    document
      .getElementById("materialModal")
      .classList
      .remove("hidden");

  }


  // =========================================================
  // MODAL - ZAMKNIĘCIE
  // =========================================================

  function closeModal() {

    document
      .getElementById("materialModal")
      .classList
      .add("hidden");

  }


  // =========================================================
  // ZAPIS MATERIAŁU
  // =========================================================

  async function saveMaterial() {

    const materialId =
      document
        .getElementById("materialId")
        .value;


    const type =
      document
        .getElementById("materialType")
        .value;


    const steel =
      document
        .getElementById("materialSteel")
        .value;


    const length =
      parseFloat(
        document
          .getElementById("materialLength")
          .value
      ) || 0;


    const thickness =
      parseFloat(
        document
          .getElementById("materialThickness")
          .value
      ) || 0;


    const quantity =
      parseFloat(
        document
          .getElementById("materialQuantity")
          .value
      );


    const location =
      document
        .getElementById("materialLocation")
        .value;


    const departmentId =
      document
        .getElementById("materialDepartment")
        .value;


    const messageDiv =
      document.getElementById("modalMessage");


    if (!type || !steel || !quantity || !location || !departmentId) {

      messageDiv.className = "error";
      messageDiv.innerText = "Wypełnij wszystkie pola";

      return;

    }


    const materialData = {
      typ: type,
      gatunek: steel,
      wymiar: length,
      grubosc: thickness,
      ilosc: quantity,
      lokalizacja: location,
      dzial_id: departmentId
    };


    messageDiv.className = "";
    messageDiv.innerText = "Zapisywanie...";


    let error;

    if (materialId) {

      // Aktualizacja
      const { error: updateError } =
        await supabaseClient
          .from("materialy")
          .update(materialData)
          .eq("id", materialId);

      error = updateError;

    } else {

      // Wstawienie nowego
      const { error: insertError } =
        await supabaseClient
          .from("materialy")
          .insert([materialData]);

      error = insertError;

    }


    if (error) {

      messageDiv.className = "error";
      messageDiv.innerText = "Błąd: " + error.message;

      return;

    }


    messageDiv.className = "success";
    messageDiv.innerText = "Materiał zapisany!";

    setTimeout(
      () => {

        closeModal();
        loadMaterials();

      },
      1000
    );

  }


  // =========================================================
  // USUWANIE MATERIAŁU
  // =========================================================

  async function deleteMaterial(id) {

    if (!confirm("Czy na pewno chcesz usunąć ten materiał?")) {

      return;

    }


    const { error } =
      await supabaseClient
        .from("materialy")
        .delete()
        .eq("id", id);


    if (error) {

      alert(
        "Błąd usuwania: " +
        error.message
      );

      return;

    }


    loadMaterials();

  }


  // =========================================================
  // UKRYTY FIELD GRUBOŚCI
  // =========================================================

  function updateThicknessField() {

    // Logika do pokazywania/ukrywania pola grubości
    // w zależności od typu materiału

  }


  // =========================================================
  // INICJALIZACJA
  // =========================================================

  startApp();

</script>

</body>
</html>
